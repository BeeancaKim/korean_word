      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;

        options: options,

          dbItems.forEach(item => {

                  word: item.w,
                  passage: pass,
                  definition: item.def,
                  distractors: item.distractors,
                  day: dayObj ? dayObj.day : dayNum,
                  unit: dayObj ? dayObj.unit : '',
                  unitTitle: dayObj ? dayObj.unitTitle : '',
                  subTitle: dayObj ? dayObj.subTitle : ''
                });

            });

        }

        const wordToItemsMap = new Map();

            wordToItemsMap.set(item.word, []);
          }
          wordToItemsMap.get(item.word).push(item);
        });

        const uniqueWords = shuffleArray(Array.from(wordToItemsMap.keys()));
        const selectedQuestions = [];

        uniqueWords.forEach(w => {

            const items = wordToItemsMap.get(w);
            const randomItem = items[Math.floor(Math.random() * items.length)];
            selectedQuestions.push(randomItem);
            usedPassageSet.add(randomItem.passage);
          }
        });

        if (selectedQuestions.length < 30) {
          const remainingPool = shuffleArray(pool.filter(item => !usedPassageSet.has(item.passage)));
          for (const item of remainingPool) {
            if (selectedQuestions.length >= 30) break;
            selectedQuestions.push(item);
            usedPassageSet.add(item.passage);
          }

                        <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-4 pb-3 border-b border-slate-200/80 gap-2">
                          <div className="flex items-center gap-2.5">
                            <span className="px-2.5 py-1 bg-indigo-600 text-white font-bold text-xs rounded-lg shadow-sm">
                              {group.unit}
                            </span>
                            <h3 className="font-bold text-slate-900 text-base md:text-lg">
                              {group.title}
                            </h3>
                            <span className="text-xs text-slate-400 font-medium">
                              ({group.days.length}개 DAY)
                            </span>
                          </div>

                          <button
                            onClick={() => allGroupSelected ? deselectUnitDays(group.days) : selectUnitDays(group.days)}
                            className={`text-xs font-bold px-3 py-1 rounded-lg border transition-colors flex items-center gap-1 self-start sm:self-auto ${
                              allGroupSelected
                                ? 'bg-slate-200 text-slate-700 border-slate-300 hover:bg-slate-300'
                                : 'bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100'
                            }`}
                          >
                            <Filter className="w-3 h-3" />
                            {allGroupSelected ? '단원 해제' : '단원 전체 선택'}
                          </button>
                        </div>

                        {/* Days Grid within Unit */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                          {groupDaysPlan.map((item) => {
                            const isSelected = selectedDays.includes(item.day);
                            return (
                              <div
                                key={item.day}
                                onClick={() => toggleDay(item.day)}
                                className={`cursor-pointer p-4 rounded-xl border transition-all duration-200 flex items-center justify-between ${
                                  isSelected
                                    ? 'bg-white border-indigo-500 shadow-md ring-2 ring-indigo-500/20 text-indigo-950'
                                    : 'bg-white border-slate-200 hover:border-slate-300 text-slate-700 hover:bg-slate-50'
                                }`}
                              >
                                <div className="pr-2">
                                  <div className="flex items-center space-x-2 mb-1">
                                    <span className={`text-sm font-black ${isSelected ? 'text-indigo-600' : 'text-slate-800'}`}>
                                      DAY {item.day}
                                    </span>
                                    <span className="text-xs font-semibold px-2 py-0.5 bg-slate-100 text-slate-600 rounded">
                                      {item.subTitle}
                                    </span>
                                  </div>
                                  <div className="text-xs text-slate-500 flex items-center gap-2">
                                    <span>범위: <strong className="text-slate-700 font-medium">{item.range}</strong></span>
                                    <span>•</span>
                                    <span>{item.count}문항</span>
                                  </div>
                                </div>

                                <div className={`w-5 h-5 rounded-md flex items-center justify-center transition-colors flex-shrink-0 ${
                                  isSelected ? 'bg-indigo-600 text-white' : 'border border-slate-300'
                                }`}>
                                  {isSelected && <Check className="w-3.5 h-3.5 stroke-[3]" />}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Selection Summary & Start */}
                <div className="mt-8 pt-6 border-t border-slate-100 flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="text-sm text-slate-600 text-center md:text-left">
                    선택된 DAY: <span className="font-extrabold text-indigo-600">{selectedDays.length}개</span> 범위 선택됨
                  </div>

                  <button
                    onClick={startReviewQuiz}
                    disabled={selectedDays.length === 0}
                    className="w-full md:w-auto px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center space-x-2 text-base"
                  >
                    <span>복습 테스트 시작하기 (30문항)</span>
                    <ArrowRight className="w-5 h-5" />
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (appState === 'QUIZ') {
        const currentQ = quizQuestions[currentIndex];
        const totalQ = quizQuestions.length;
        const progressPercent = Math.round(((currentIndex + 1) / totalQ) * 100);

        return (
          <div className="min-h-screen bg-slate-50 text-slate-800 py-8 px-4 font-sans flex flex-col justify-center">
            <div className="max-w-2xl mx-auto w-full">
              {/* Progress Header */}
              <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 mb-6">
                <div className="flex items-center justify-between mb-3 gap-2">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold px-2.5 py-1 bg-indigo-600 text-white rounded-md">
                      {currentQ.unit}
                    </span>
                    <span className="text-xs font-semibold px-2 py-1 bg-slate-100 text-slate-700 rounded-md">
                      DAY {currentQ.day} ({currentQ.subTitle})
                    </span>
                  </div>
                  <span className="text-sm font-extrabold text-indigo-600">
                    {currentIndex + 1} / {totalQ}
                  </span>
                </div>
                <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                  <div
                    className="bg-indigo-600 h-full transition-all duration-300 ease-out"
                    style={{ width: `${progressPercent}%` }}
                  ></div>
                </div>
              </div>

              {/* Question Card */}
              <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200 mb-6">
                <div className="mb-6">
                  <h2 className="text-lg md:text-xl font-bold text-slate-900 mb-4 leading-snug">
                    다음 예문의 빈칸에 들어갈 어휘의 기본형으로 가장 적절한 것은?
                  </h2>

                  <div className="p-5 md:p-6 bg-slate-50 rounded-xl border border-slate-200 text-base md:text-lg text-slate-800 font-medium leading-relaxed">
                    "{currentQ.passage}"
                  </div>
                </div>

                {/* Options */}
                <div className="space-y-3">
                  {currentQ.options.map((option, idx) => (
                    <button
                      key={idx}
                      onClick={() => handleSelectOption(option)}
                      className="w-full text-left p-4 rounded-xl border border-slate-200 bg-white hover:border-indigo-500 hover:bg-indigo-50/50 text-slate-800 font-medium transition-all duration-150 flex items-center justify-between group"
                    >
                      <div className="flex items-center space-x-3">
                        <span className="w-7 h-7 rounded-lg bg-slate-100 group-hover:bg-indigo-600 group-hover:text-white text-slate-600 text-xs font-bold flex items-center justify-center transition-colors">
                          {idx + 1}
                        </span>
                        <span className="text-base font-semibold">{option}</span>
                      </div>
                      <ChevronRight className="w-5 h-5 text-slate-400 group-hover:text-indigo-600 transition-colors" />
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (appState === 'REVIEW') {
        const correctCount = userAnswers.filter(a => a.isCorrect).length;
        const score = Math.round((correctCount / userAnswers.length) * 100);
        const wrongAnswers = userAnswers.filter(a => !a.isCorrect);

        return (
          <div className="min-h-screen bg-slate-50 text-slate-800 py-8 px-4 font-sans">
            <div className="max-w-3xl mx-auto">
              {/* Top Return Header */}
              <div className="flex items-center justify-between mb-6">
                <button
                  onClick={() => setAppState('SELECT')}
                  className="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold rounded-xl text-sm shadow-sm transition-colors flex items-center gap-2"
                >
                  <Home className="w-4 h-4 text-indigo-600" />
                  <span>메인으로 돌아가기 (범위 다시 선택)</span>
                </button>

                <button
                  onClick={startReviewQuiz}
                  className="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold rounded-xl text-sm transition-colors flex items-center gap-1.5"
                >
                  <RefreshCw className="w-4 h-4" />
                  <span>같은 범위 재시험</span>
                </button>
              </div>

              {/* Summary Banner */}
              <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200 mb-8 text-center">
                <div className="inline-flex p-3 rounded-full bg-indigo-50 text-indigo-600 mb-4">
                  <Award className="w-10 h-10" />
                </div>
                <h1 className="text-2xl md:text-3xl font-bold text-slate-900 mb-2">
                  복습 테스트 완료
                </h1>
                <p className="text-slate-500 text-sm mb-6">
                  선택한 DAY 영역에 대한 어휘 평가가 끝났습니다.
                </p>

                <div className="grid grid-cols-3 gap-4 max-w-md mx-auto mb-6">
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div className="text-xs text-slate-500 font-medium mb-1">최종 점수</div>
                    <div className="text-2xl font-black text-indigo-600">{score}점</div>
                  </div>
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div className="text-xs text-slate-500 font-medium mb-1">맞힌 문제</div>
                    <div className="text-2xl font-black text-slate-800">{correctCount} / {userAnswers.length}</div>
                  </div>
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div className="text-xs text-slate-500 font-medium mb-1">소요 시간</div>
                    <div className="text-2xl font-black text-slate-800">{Math.floor(elapsedTime / 60)}분 {elapsedTime % 60}초</div>
                  </div>
                </div>

                <div className="flex flex-col sm:flex-row items-center justify-center gap-3">
                  <button
                    onClick={() => setAppState('SELECT')}
                    className="w-full sm:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-colors inline-flex items-center justify-center space-x-2"
                  >
                    <Home className="w-4 h-4" />
                    <span>메인으로 돌아가기</span>
                  </button>

                  <button
                    onClick={startReviewQuiz}
                    className="w-full sm:w-auto px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors inline-flex items-center justify-center space-x-2"
                  >
                    <RotateCcw className="w-4 h-4" />
                    <span>같은 범위 다시 풀기</span>
                  </button>
                </div>
              </div>

              {/* Wrong Answer Note */}
              <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200">
                <h2 className="text-xl font-bold text-slate-900 mb-6 flex items-center justify-between">
                  <span>오답 노트 ({wrongAnswers.length}문항)</span>
                  {wrongAnswers.length === 0 && (
                    <span className="text-xs font-normal text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">
                      모든 문제를 맞히셨습니다!
                    </span>
                  )}
                </h2>

                {wrongAnswers.length === 0 ? (
                  <div className="text-center py-12 text-slate-500">
                    <CheckCircle className="w-12 h-12 text-emerald-500 mx-auto mb-3 opacity-80" />
                    <p className="font-semibold text-slate-700">틀린 문제가 없습니다.</p>
                    <p className="text-xs mt-1 text-slate-400">완벽하게 어휘를 숙지하셨습니다!</p>
                  </div>
                ) : (
                  <div className="space-y-6">
                    {wrongAnswers.map((item, idx) => (
                      <div key={idx} className="p-5 rounded-xl border border-slate-200 bg-slate-50/50">
                        <div className="flex items-center justify-between mb-3 gap-2">
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-bold text-slate-600">
                              문제 {item.questionIndex}
                            </span>
                            <span className="text-xs font-semibold px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded border border-indigo-100">
                              {item.unit} ({item.subTitle}) • DAY {item.day}
                            </span>
                          </div>
                          <span className="text-xs font-bold text-red-500 bg-red-50 px-2.5 py-0.5 rounded-md border border-red-100">
                            오답
                          </span>
                        </div>

                        <p className="text-slate-800 font-medium mb-4 p-4 bg-white rounded-lg border border-slate-200">
                          "{item.passage}"
                        </p>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm mb-3">
                          <div className="p-3 bg-red-50/80 border border-red-200 rounded-lg text-red-900">
                            <span className="text-xs font-bold text-red-600 block mb-0.5">내가 선택한 답</span>
                            <span className="font-semibold">{item.chosen}</span>
                          </div>
                          <div className="p-3 bg-emerald-50/80 border border-emerald-200 rounded-lg text-emerald-900">
                            <span className="text-xs font-bold text-emerald-600 block mb-0.5">올바른 정답</span>
                            <span className="font-semibold">{item.correct}</span>
                          </div>
                        </div>

                        <div className="p-3 bg-white border border-slate-200 rounded-lg text-xs text-slate-600">
                          <span className="font-bold text-slate-800 mr-1">[{item.correct}] 사전적 의미:</span>
                          {item.definition}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
